# Troisième contrôle de la chaîne d'hygiène : GitHub rejoue tout sur chaque pull request.
name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install ruff pytest
      - name: Forme (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: |
          python -m pytest -q || [ $? -eq 5 ]

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forme, défauts et tests (cargo fmt, clippy, cargo test)
        run: |
          if [ ! -f Cargo.toml ]; then echo "Pas de code Rust dans ce dépôt."; exit 0; fi
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings -W clippy::cognitive_complexity
          cargo test
